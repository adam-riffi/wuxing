name: sanity

# A fast signal on every branch push: lint + unit tests + build on a single OS.
# Feature branches get this cheap check before a PR exists. main and dev are
# excluded here because they run the full matrix in ci.yml, and PRs run ci.yml
# too — so the slow 3-OS matrix never double-runs.
on:
  push:
    branches-ignore: [main, dev]

permissions:
  contents: read

concurrency:
  group: sanity-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.23"

jobs:
  sanity:
    name: sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
      - name: go test (short)
        run: go test ./... -short
      - name: go build
        run: go build ./cmd/...
