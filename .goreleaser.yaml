# GoReleaser config — builds the daemon and CLI for linux/mac/windows and
# publishes a Docker image to GHCR on a v*.*.* tag. See .github/workflows/release.yml.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: wuxing
    main: ./cmd/wuxing
    binary: wuxing
    env: [CGO_ENABLED=0]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: wxg
    main: ./cmd/wxg
    binary: wxg
    env: [CGO_ENABLED=0]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

dockers:
  - image_templates:
      - "ghcr.io/adam-riffi/wuxing:{{ .Version }}"
      - "ghcr.io/adam-riffi/wuxing:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--build-arg=VERSION={{ .Version }}"

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
